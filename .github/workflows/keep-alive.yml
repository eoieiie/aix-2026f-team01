# Supabase 무료 요금제는 1주일 안 쓰면 멈춘다. 매일 09:00(KST)에 한 번 요청한다 (spec.md 8절 CI)
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC = 09:00 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: DB에 요청 한 번
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL, SUPABASE_ANON_KEY 변수가 없어 건너뛴다"
            exit 0
          fi
          # foods는 spec.md 5절의 표. 권한 때문에 0행이어도 DB 조회는 일어난다
          curl --fail-with-body -sS \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/foods?select=id&limit=1"
