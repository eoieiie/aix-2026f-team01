# Supabase 무료 요금제는 1주일 안 쓰면 멈춘다. 매일 09:00(KST)에 한 번 요청한다 (spec.md 8절 CI)
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC = 09:00 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: DB에 요청 한 번
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL, SUPABASE_ANON_KEY 변수가 없어 건너뛴다"
            exit 0
          fi
          # foods는 spec.md 5절의 표. 로그인하지 않은 요청이라 권한 없음(401, 42501)이 오는데,
          # 그 답은 DB가 권한을 확인하고 돌려준 것이라 DB는 깨어난다. 그래서 그 경우도 성공으로 본다.
          # 표가 없거나(404) 프로젝트가 멈춰 있으면(5xx) 실패한다
          code=$(curl -sS -o body.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/foods?select=id&limit=1")
          echo "HTTP $code"; cat body.json; echo
          if [ "$code" = "200" ]; then exit 0; fi
          if [ "$code" = "401" ] && grep -q '"42501"' body.json; then exit 0; fi
          exit 1
