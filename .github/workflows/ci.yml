# PR마다 타입 검사, 린트, 테스트, 웹 빌드 (spec.md 8절 CI)
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 린트
        run: npm run lint
      - name: 테스트
        run: npm test -- --ci
      - name: 웹 빌드
        run: npm run build:web
