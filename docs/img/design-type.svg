    <text x="101.5" y="460" font-size="88" font-weight="800" fill="#FFFFFF" text-anchor="middle">한</text>
    <text x="101.5" y="498" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">한식 위주</text>
