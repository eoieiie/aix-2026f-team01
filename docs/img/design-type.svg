    <text x="273.5" y="282" font-size="88" font-weight="800" fill="#FFFFFF" text-anchor="middle">매</text>
    <text x="273.5" y="320" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">매운 게 좋아</text>
